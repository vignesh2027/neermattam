{{define "mapcore"}}<script nonce="{{.Nonce}}">
/* Shared map glue: style tint, hex cell layers, live updates, popups. */
window.NM = (function () {
  "use strict";
  var maps = [];
  var STYLE = "https://tiles.openfreemap.org/styles/positron";
  // Every value read from a feature is coalesced, so a cell with a missing
  // or null field never makes an expression warn or fail.
  var DEPTH_VALUE = ["to-number", ["coalesce", ["get", "depth_cm"], 0], 0];
  var DEPTH = ["step", DEPTH_VALUE, "#BAE6FD", 15, "#38BDF8", 30, "#2563EB", 50, "#4C1D95", 80, "#9F1239"];
  var HAZARD = ["match", ["coalesce", ["get", "hazard_class"], "unknown"], "low", "#BAE6FD", "danger_some", "#38BDF8", "danger_most", "#4C1D95", "danger_all", "#9F1239", "#CBD5E1"];
  // Interface text for the current language, rendered by the server.
  var TEXT = {};
  try { TEXT = JSON.parse(document.getElementById("i18n").textContent); } catch (e) { TEXT = {}; }
  function tr(key) {
    var s = TEXT[key] || key, args = Array.prototype.slice.call(arguments, 1), i = 0;
    return s.replace(/%(\.\d)?[sdf]/g, function () { var a = args[i++]; return a == null ? "" : String(a); });
  }
  function place(p) {
    if (!p) return "";
    if (p.indexOf("near ") === 0) return tr("js.place_near", p.slice(5));
    return p.charAt(0).toUpperCase() + p.slice(1);
  }
  // The page's city: its box frames the map; cells and the stream are its.
  var CITY = { id: "chennai", bbox: [80.10, 12.80, 80.33, 13.24], centre: [80.215, 13.02] };
  try { CITY = JSON.parse(document.getElementById("city").textContent) || CITY; } catch (e) {}
  function cityView(extra) {
    var o = CITY.id === "chennai" ? { center: [80.2209, 13.0], zoom: 11.3 }
      : { bounds: [[CITY.bbox[0], CITY.bbox[1]], [CITY.bbox[2], CITY.bbox[3]]], fitBoundsOptions: { padding: 24 } };
    return Object.assign(o, extra || {});
  }
  var HAZ_TEXT = { low: tr("hazard.low"), danger_some: tr("hazard.danger_some"), danger_most: tr("hazard.danger_most"), danger_all: tr("hazard.danger_all"), unknown: tr("hazard.unknown") };
  var HAZ_CHIP = { low: "chip", danger_some: "chip", danger_most: "chip chip-violet", danger_all: "chip chip-danger", unknown: "chip chip-grey" };

  function depthColor(cm) {
    return cm < 15 ? "#BAE6FD" : cm < 30 ? "#38BDF8" : cm < 50 ? "#2563EB" : cm < 80 ? "#4C1D95" : "#9F1239";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ago(iso) {
    var s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return tr("js.just_now");
    if (s < 3600) return tr("js.min_ago", Math.round(s / 60));
    if (s < 86400) return tr("js.h_ago", (s / 3600).toFixed(s < 36000 ? 1 : 0));
    return tr("js.d_ago", Math.round(s / 86400));
  }

  function tint(m) {
    function set(id, prop, val) { if (m.getLayer(id)) m.setPaintProperty(id, prop, val); }
    set("background", "background-color", "#F1F4F8");
    set("water", "fill-color", "#D3DEEC");
    set("waterway", "line-color", "#C3D2E6");
    set("park", "fill-color", "#E5ECE8");
    set("landcover_wood", "fill-color", "#E1E9E4");
    set("landuse_residential", "fill-color", "#ECF0F5");
    set("building", "fill-color", "#E5EAF1");
    set("building", "fill-outline-color", "#D3DDEB");
    ["highway_minor", "highway_path"].forEach(function (id) { set(id, "line-color", "#FFFFFF"); });
    set("highway_major_casing", "line-color", "#CFDAEA");
    set("highway_motorway_casing", "line-color", "#C3D2E7");
    ["railway", "railway_transit", "railway_service"].forEach(function (id) { set(id, "line-color", "#D5DEEB"); });
    ["label_city", "label_city_capital", "label_town", "label_village", "label_other", "label_state"].forEach(function (id) {
      set(id, "text-color", "#1E3155"); set(id, "text-halo-color", "rgba(255,255,255,0.9)");
    });
    ["highway-name-minor", "highway-name-major", "highway-name-path"].forEach(function (id) { set(id, "text-color", "#56698A"); });
    ["water_name_point_label", "water_name_line_label"].forEach(function (id) { set(id, "text-color", "#3A5C9C"); });
    tidy(m);
  }

  // The base style compares some numeric tile fields that many features
  // lack (road shields test ref_length <= 6), so MapLibre warns about nulls
  // on every tile. A missing number now simply fails the comparison, which
  // is what the style intends, without the warning.
  var FAIL = { "<": 1e9, "<=": 1e9, ">": -1e9, ">=": -1e9 };
  function guard(x) {
    if (!Array.isArray(x)) return x;
    if (FAIL[x[0]] !== undefined && x.length === 3) {
      return [x[0]].concat(x.slice(1).map(function (a) {
        return Array.isArray(a) && a[0] === "get" ? ["coalesce", a, FAIL[x[0]]] : guard(a);
      }));
    }
    return x.map(guard);
  }
  function tidy(m) {
    m.getStyle().layers.forEach(function (l) {
      var f = m.getFilter(l.id);
      if (!f) return;
      var g = guard(f);
      if (JSON.stringify(g) !== JSON.stringify(f)) m.setFilter(l.id, g);
    });
  }

  function hatch(m) {
    if (m.hasImage("hatch")) return;
    var s = 16, d = new Uint8Array(s * s * 4);
    for (var y = 0; y < s; y++) for (var x = 0; x < s; x++) {
      var i = (y * s + x) * 4, on = ((x + y) % 8) < 2;
      d[i] = 92; d[i + 1] = 108; d[i + 2] = 134; d[i + 3] = on ? 170 : 34;
    }
    m.addImage("hatch", { width: s, height: s, data: d }, { pixelRatio: 2 });
  }

  function firstSymbol(m) {
    var ls = m.getStyle().layers;
    for (var i = 0; i < ls.length; i++) if (ls[i].type === "symbol") return ls[i].id;
  }

  function create(id, opts) {
    var m = new maplibregl.Map(Object.assign({
      container: id, style: STYLE, center: CITY.centre, zoom: 11, minZoom: 8.5, maxZoom: 18,
      maxBounds: [[CITY.bbox[0] - 0.3, CITY.bbox[1] - 0.3], [CITY.bbox[2] + 0.3, CITY.bbox[3] + 0.3]],
      attributionControl: false, dragRotate: false, pitchWithRotate: false
    }, opts || {}));
    m.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: "Flood cells: Neermattam" }), "bottom-right");
    if (m.getContainer().clientWidth < 720) {
      // On small maps the credits start folded behind the (i) button; the
      // page footer also credits OpenStreetMap and OpenFreeMap.
      m.once("load", function () {
        var a = m.getContainer().querySelector(".maplibregl-ctrl-attrib");
        if (a) a.classList.remove("maplibregl-compact-show");
      });
    }
    m.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    m.touchZoomRotate.disableRotation();
    // MapLibre watches its container too, but skips the first size report,
    // so a map built before the layout settled (fonts, grid columns) kept
    // its first, smaller canvas and drew tiles in part of the box only.
    // Resize whenever the container's size differs from the canvas.
    function fit() {
      var c = m.getContainer(), cv = m.getCanvas();
      if (!c || !cv || m._removed) return;
      if (Math.abs(c.clientWidth - cv.clientWidth) > 1 || Math.abs(c.clientHeight - cv.clientHeight) > 1) m.resize();
    }
    if (window.ResizeObserver) {
      new ResizeObserver(function () { requestAnimationFrame(fit); }).observe(m.getContainer());
    }
    m.once("load", fit);
    window.addEventListener("load", fit);
    m.on("style.load", function () { tint(m); });
    // A quiet loading veil until the first frame with data is drawn.
    var veil = el("div", "map-loading");
    veil.setAttribute("role", "status");
    veil.appendChild(el("span", "map-spinner"));
    veil.appendChild(el("span", null, tr("js.loading_map")));
    m.getContainer().appendChild(veil);
    var lifted = false;
    function lift() {
      if (lifted) return;
      lifted = true;
      api.firstPaintMs = Math.round(performance.now());
      veil.classList.add("is-gone");
      setTimeout(function () { veil.remove(); }, 400);
    }
    m.on("load", function () { m.once("idle", lift); });
    m._nmLift = lift;
    setTimeout(lift, 15000);
    m.on("error", function (e) { if (!m.loaded() && e && e.error) veil.lastChild.textContent = tr("js.basemap_slow"); });
    maps.push(m);
    return m;
  }

  function addCells(m, opts) {
    opts = opts || {};
    hatch(m);
    m.addSource("cells", { type: "geojson", data: { type: "FeatureCollection", features: [] }, promoteId: "cell" });
    var before = firstSymbol(m);
    m.addLayer({ id: "cells-fill", type: "fill", source: "cells", filter: ["!", ["coalesce", ["get", "unknown"], false]],
      paint: { "fill-color": DEPTH, "fill-opacity": opts.opacity || 0.8 } }, before);
    m.addLayer({ id: "cells-unknown", type: "fill", source: "cells", filter: ["coalesce", ["get", "unknown"], false],
      paint: { "fill-pattern": "hatch", "fill-opacity": 0.95 } }, before);
    m.addLayer({ id: "cells-line", type: "line", source: "cells",
      paint: { "line-color": "#FFFFFF", "line-width": ["interpolate", ["linear"], ["zoom"], 11, 0.15, 15, 1.2], "line-opacity": 0.75 } }, before);
    m.addLayer({ id: "cells-real", type: "line", source: "cells", filter: ["!=", ["coalesce", ["get", "origin"], "simulated"], "simulated"],
      paint: { "line-color": "#0B1B33", "line-width": ["interpolate", ["linear"], ["zoom"], 11, 1, 15, 2.4] } }, before);
    m.addLayer({ id: "cells-flash", type: "line", source: "cells",
      paint: { "line-color": "#FFFFFF", "line-width": ["interpolate", ["linear"], ["zoom"], 11, 1.5, 15, 4],
        "line-opacity": ["case", ["boolean", ["feature-state", "flash"], false], 1, 0],
        "line-opacity-transition": { duration: 600 } } }, before);
    if (!opts.showReal) m.setLayoutProperty("cells-real", "visibility", "none");
  }

  function colourBy(m, mode) {
    if (m.getLayer("cells-fill")) m.setPaintProperty("cells-fill", "fill-color", mode === "hazard" ? HAZARD : DEPTH);
  }

  /* Keeps the cells source in step with /api/cells and /api/stream. */
  function live(m, hooks) {
    hooks = hooks || {};
    var feats = {}, timer = null, es = null, etag = hooks.etag || "";
    var first = true;
    function push() {
      timer = null;
      var list = Object.keys(feats).map(function (k) { return feats[k]; });
      if (first) {
        // Lift the loading veil as soon as the cells are on screen, even if
        // base map tiles are still arriving.
        first = false;
        var onData = function (e) {
          if (e.sourceId === "cells" && e.isSourceLoaded) {
            m.off("sourcedata", onData);
            requestAnimationFrame(function () { requestAnimationFrame(function () { if (m._nmLift) m._nmLift(); }); });
          }
        };
        m.on("sourcedata", onData);
      }
      m.getSource("cells").setData({ type: "FeatureCollection", features: list });
      if (hooks.onData) hooks.onData(list);
    }
    function schedule() { if (!timer) timer = setTimeout(push, 200); }
    function key(f) { return (f.properties && f.properties.cell) || f.id; }
    function take(fc) { feats = {}; (fc.features || []).forEach(function (f) { feats[key(f)] = f; }); push(); }
    function load() {
      var h = { Accept: "application/json" };
      if (etag) h["If-None-Match"] = etag;
      return fetch("/api/cells?city=" + encodeURIComponent(CITY.id), { headers: h })
        .then(function (r) {
          if (r.status === 304) return null;
          if (!r.ok) throw new Error(r.status);
          etag = r.headers.get("ETag") || "";
          return r.json();
        })
        .then(function (fc) { if (fc) take(fc); })
        .catch(function () { if (hooks.onStatus) hooks.onStatus("down"); });
    }
    function flash(id) {
      setTimeout(function () {
        try { m.setFeatureState({ source: "cells", id: id }, { flash: true }); } catch (e) { return; }
        setTimeout(function () { try { m.setFeatureState({ source: "cells", id: id }, { flash: false }); } catch (e) {} }, 1400);
      }, 260);
    }
    function connect() {
      if (!window.EventSource) return;
      es = new EventSource("/api/stream?city=" + encodeURIComponent(CITY.id));
      es.onopen = function () { if (hooks.onStatus) hooks.onStatus("up"); };
      es.onerror = function () { if (hooks.onStatus) hooks.onStatus("down"); };
      es.addEventListener("cell", function (e) {
        var f = JSON.parse(e.data), id = key(f);
        feats[id] = f; schedule(); flash(id);
        if (hooks.onCell) hooks.onCell(f);
      });
      es.addEventListener("resync", function () { load(); });
      es.addEventListener("report", function (e) { if (hooks.onReport) hooks.onReport(JSON.parse(e.data)); });
    }
    if (hooks.initial) {
      // Cells came inline with the page: draw them now, then open the live
      // stream and revalidate in the background (usually a 304).
      take(hooks.initial);
      connect();
      load();
    } else {
      load().then(connect);
    }
    return { reload: load };
  }

  function popupFor(p) {
    var box = el("div");
    var head = el("div", "pop-head");
    if (p.unknown) {
      head.appendChild(el("b", null, tr("hazard.unknown")));
      box.appendChild(head);
      box.appendChild(el("div", "pop-bar")).style.background = "repeating-linear-gradient(135deg,#8A99B2 0 2px,#F1F4F9 2px 6px)";
      box.appendChild(el("p", "pop-unknown", tr("js.unknown_note", Math.round(p.depth_cm), Math.round(p.depth_sigma_cm))));
    } else {
      head.appendChild(el("b", null, Math.round(p.depth_cm) + " cm"));
      head.appendChild(el("span", null, "± " + (Math.round(p.depth_sigma_cm * 10) / 10) + " cm"));
      box.appendChild(head);
      box.appendChild(el("div", "pop-bar")).style.background = depthColor(p.depth_cm);
    }
    var dl = el("dl", "pop-rows");
    function row(k, v) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); }
    if (!p.unknown) row(tr("js.upper"), Math.round(p.depth_upper_cm) + " cm");
    row(tr("js.velocity"), p.velocity_assumed || p.velocity_mps == null ? tr("js.not_measured") :
      p.velocity_mps.toFixed(2) + " ± " + (p.velocity_sigma_mps || 0).toFixed(2) + " m/s");
    if (p.hazard_rating != null && !p.unknown) row(tr("js.hazard_rating"), p.hazard_rating.toFixed(2) + (p.velocity_assumed ? " " + tr("js.v_assumed") : ""));
    row(tr("js.reports"), tr("js.reports_here", p.n_readings, p.n_neighbour || 0));
    row(tr("js.updated"), ago(p.updated_at));
    box.appendChild(dl);
    var tags = el("div", "pop-tags");
    var cls = p.unknown ? "unknown" : p.hazard_class;
    tags.appendChild(el("span", HAZ_CHIP[cls] || "chip", HAZ_TEXT[cls] || cls));
    if (p.origin === "simulated") tags.appendChild(el("span", "chip chip-violet", tr("sim.title_plain")));
    else if (p.origin === "mixed") tags.appendChild(el("span", "chip chip-violet", tr("js.mixed")));
    else tags.appendChild(el("span", "chip chip-ok", tr("js.real_reports")));
    box.appendChild(tags);
    return box;
  }

  function popups(m) {
    ["cells-fill", "cells-unknown"].forEach(function (layer) {
      m.on("click", layer, function (e) {
        var f = e.features && e.features[0];
        if (!f) return;
        new maplibregl.Popup({ maxWidth: "300px", focusAfterOpen: true }).setLngLat(e.lngLat).setDOMContent(popupFor(f.properties)).addTo(m);
      });
      m.on("mouseenter", layer, function () { m.getCanvas().style.cursor = "pointer"; });
      m.on("mouseleave", layer, function () { m.getCanvas().style.cursor = ""; });
    });
  }

  var api = { city: CITY, cityView: cityView, maps: maps, create: create, addCells: addCells, live: live, popups: popups, colourBy: colourBy, depthColor: depthColor, el: el, ago: ago, tr: tr, place: place, firstPaintMs: null };
  return api;
})();
</script>{{end}}
